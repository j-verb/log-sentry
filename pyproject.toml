[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-sentry"
version = "0.1.0"
description = "A lightweight Linux system log anomaly detector"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
log-sentry = "log_sentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
